# Data Dictionary RBAC
#
# edit_data_dictionary gates every metadata / field-definition / catalog-rebuild
# write in this app. Read access (browsing the dictionary, the MCP query tools)
# needs nothing extra. Grant this capability to whichever roles should be able to
# curate governance metadata; it is granted to admin out of the box.

[capability::edit_data_dictionary]

[role_admin]
edit_data_dictionary = enabled
