# App-prefixed stanza names and app-scoped match paths for unambiguous routing.
[script:data_dictionary_ping]
match = /data_dictionary/ping
script = ping.py
scripttype = persist
handler = ping.PingHandler
python.version = python3
python.required = 3.9,3.13
passPayload = true
passSystemAuth = true

