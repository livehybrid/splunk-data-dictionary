# Macros for option-list searches. Point contact macros to all_contacts for easy customisation.
# Lookup name = transforms stanza (all_contacts), not the .csv filename.
[all_contacts_list]
definition = | inputlookup all_contacts
iseval = 0

# Operational / escalation contacts: use macro so it can be switched to a different search later.
[operation_contacts_list]
definition = | inputlookup all_contacts
iseval = 0

# Data owner / service owner / security owner can use the same list or separate macros later.
[data_owner_list]
definition = | inputlookup all_contacts
iseval = 0
