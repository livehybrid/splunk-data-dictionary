# Lookup for Data Dictionary catalog (index + sourcetype rows).
# Populated by saved search "Data Dictionary - Build Catalog"; app reads via discovery/catalog.
[data_dictionary_catalog]
filename = data_dictionary_catalog.csv

# KV-store-backed lookup over the [metadata] collection so governance metadata can
# be merged into catalog rows in pure SPL (| inputlookup / | lookup) WITHOUT the
# `| rest` command — which the Splunk MCP search sandbox forbids. The MCP tool
# execution templates (appserver/static/tool_input_payload_signatures.json) use
# this lookup to overlay owner / PII / classification onto catalog rows.
[data_dictionary_metadata]
external_type = kvstore
collection = metadata
fields_list = _key, data_owner, data_category, pii_status, export_classification, service_owner, security_owner, escalation_contacts, updated_by, updated_at

# Option list lookups for metadata dropdowns (customise per customer).
[all_contacts]
filename = all_contacts.csv

[pii_levels]
filename = pii_levels.csv

[export_classification_options]
filename = export_classification_options.csv
