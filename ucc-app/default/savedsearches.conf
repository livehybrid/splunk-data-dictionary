# Saved search to build the Data Dictionary catalog (index + sourcetype from actual data).
# Schedule this search (e.g. daily) so the catalog stays up to date. Enabled by default.
[Data Dictionary - Build Catalog]
search = | rest /services/data/indexes | rename title AS index | table index frozenTimePeriodInSecs | map maxsearches=999 search="| metadata type=sourcetypes where index=$index$ | eval index=\"$index$\"" | outputlookup data_dictionary_catalog
disabled = 0
description = Populates the data_dictionary_catalog lookup with index and sourcetype pairs from actual data. Schedule this search so the Data Dictionary app shows current catalog.
displayview = search
