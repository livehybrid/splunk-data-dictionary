#
# Data Dictionary — app.conf
#
# NOTE: The original app.conf on the live instance is owned by splunk:splunk and
# was not world-readable, so this file was reconstructed from app.manifest /
# globalConfig.json and the splunk-react-app skill's AppInspect requirements.
# Values below are the canonical, AppInspect-clean settings for this app.
#

[install]
state = enabled
is_configured = false

[package]
id = data_dictionary_for_splunk
check_for_updates = true

[ui]
is_visible = true
label = Data Dictionary

[launcher]
author = LiveHybrid
description = Catalog Splunk indexes, sourcetypes, and sources with governance metadata (Data Owner, PII status, Export Classification), with an agent-ready REST/MCP surface.
version = 1.1.2

# AppInspect requires a [triggers] reload entry for *custom* config types.
# tools.conf is custom (needs a trigger). restmap.conf is a Splunk-defined conf
# and must NOT appear here (AppInspect check_for_trigger_stanza fails otherwise).
# On every app-state change (install/enable/upgrade) Splunk POSTs to the autoregister
# endpoint (http_post is the correct trigger type for our persistent [script:] handler;
# access_endpoints would call a _reload() method it doesn't implement). The handler then
# self-registers the MCP tools on Splunk Enterprise (Splunk Cloud registers natively).
# NOTE: the URL omits the /services prefix, matching Splunk's own [triggers] convention
# (e.g. reload.indexes = access_endpoints /data/indexes). Proven on Splunk Enterprise.
[triggers]
reload.tools = http_post /data_dictionary/autoregister
