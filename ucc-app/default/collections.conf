# KV store collection for data dictionary metadata.
# Key format: index:<name> or sourcetype:<name>

[metadata]
field.data_owner = string
field.data_category = string
field.pii_status = string
field.export_classification = string
field.service_owner = string
field.security_owner = string
field.escalation_contacts = string
field.updated_by = string
field.updated_at = number

# Admin-managed metadata field definitions (custom + standard). _key = field id.
[field_defs]
field.label = string
field.type = string
field.options = string
field.options_source = string
field.standard = bool
field.hidden = bool
field.order = number
field.updated_by = string
field.updated_at = number
