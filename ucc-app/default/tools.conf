# Splunk MCP tool registration (see Splunk MCP tools.conf spec).
# endpoint_name matches the [script:…] stanza name in restmap.conf (e.g. script:dictionary_query).
# The HTTP URL is NOT /services/<endpoint_name>. It is the restmap "match" path under this app
# (e.g. dictionary_query -> match = /data_dictionary/dictionary/query in restmap.conf; /services/dictionary_query 404s).

[restmap:data_dictionary_index_metadata]
description = Look up data governance and OWNERSHIP for a specific named Splunk index. Answers "who owns this index?", "who do I get sign-off / approval from to give a user access to (or onboard data into) it?", "who is the data owner / security owner / service owner / escalation contact?", "is it PII and what is its data classification?". Returns each sourcetype in the index with its owners, escalation contacts, PII status, data category and export classification (the authoritative governance record). Use data_dictionary_query to search across indexes by keyword.
endpoint_name = dictionary_index
method = get
tags = data_dictionary, governance, data_ownership, data_owner, access_request, sign_off, approval, onboarding, rbac, pii, data_classification, security_owner, escalation_contact, compliance, index, metadata

[restmap:data_dictionary_query]
description = Search the Data Dictionary across ALL indexes and sourcetypes to find data and its governance / OWNERSHIP by keyword or topic. Answers "who owns the customer / payment / cultivar data?", "I need to give a user access to the X indexes, who do I get sign-off from?", "which sourcetypes are PII?", "what is owned by team X or classified Restricted?". q matches across index, sourcetype and every governance field (data owner, security/service owner, escalation contacts, PII status, data category, export classification). Optional index, sourcetype, limit (default 100, max 500), offset. For one known index, prefer data_dictionary_index_metadata.
endpoint_name = dictionary_query
method = get
tags = data_dictionary, governance, data_ownership, data_owner, access_request, sign_off, approval, find_owner, who_owns, pii, data_classification, security_owner, escalation_contact, compliance, search, discovery, sourcetype, index

[restmap:data_dictionary_ping]
description = Lightweight health check for the Data Dictionary app REST stack. Returns JSON { ok: true, app: data_dictionary } when the session is valid; use to verify connectivity and RBAC before calling other tools.
endpoint_name = data_dictionary_ping
method = get
tags = data_dictionary, health, ping
